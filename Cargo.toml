[package]
name = "synco_ai_gateway"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
# Vérification Ed25519 des tickets sgt1. aws-lc-rs 1.18.1 (publiée le 2026-09-01) était déjà dans
# Cargo.lock (backend de rustls), mais l'utiliser en direct ajoute la crate transitive
# `untrusted 0.7.1` (publiée le 2020-04-28), nouvelle dans le lock. Épinglée.
aws-lc-rs = "=1.18.1"
# Déjà dans Cargo.lock (reqwest) : seulement `StreamExt::map` pour tenir la place du limiteur.
futures-util = { version = "0.3", default-features = false }
