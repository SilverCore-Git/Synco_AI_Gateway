# Déploiement avancé : Ollama et la passerelle dans des conteneurs séparés (mise à jour
# indépendante, Ollama éventuellement partagé). Pour une installation en une seule commande,
# préférez l'image tout-en-un par défaut (`docker build .` avec le Dockerfile racine) — voir le
# README. Copiez ce fichier en docker-compose.yml et ajustez ALLOWED_ORIGIN avant de lancer
# `docker compose up -d`.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Décommentez pour exposer un GPU Nvidia au conteneur (nécessite le NVIDIA Container Toolkit) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  synco-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway-only
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      # Origine du frontend Synco autorisée en CORS. "*" fonctionne mais autorise n'importe
      # quel site à appeler la passerelle depuis le navigateur d'un utilisateur authentifié :
      # à restreindre en production.
      ALLOWED_ORIGIN: "https://app.votre-synco.example"
      # Ollama vit dans un conteneur séparé ici (au lieu du même conteneur pour l'image
      # tout-en-un) : on le pointe explicitement via le nom du service Docker Compose.
      OLLAMA_URL: "http://ollama:11434"
      # URL de l'API Synco vue DEPUIS CE CONTENEUR — pas depuis le navigateur, ce n'est pas la
      # même chose. En production, l'adresse publique HTTPS habituelle fonctionne directement.
      # En développement local, si synco_api tourne sur la machine hôte (pas dans Compose),
      # décommentez les deux lignes suivantes (nécessaire sur Linux ; Docker Desktop sur
      # Mac/Windows fournit déjà host.docker.internal automatiquement) :
      SYNCO_API_URL: "https://api.votre-synco.example"
      # SYNCO_API_URL: "https://host.docker.internal:9000"
      # SYNCO_API_ALLOW_INSECURE_TLS: "true"  # si synco_api local utilise son certificat auto-signé par défaut
      RUST_LOG: info
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"  # requis sur Linux pour SYNCO_API_URL=...host.docker.internal...

volumes:
  ollama_data:
